included:
  - EcommerceTraining
  - EcommerceTrainingTests

excluded:
  - EcommerceTraining/Assets.xcassets

opt_in_rules:
  - force_unwrapping
  - explicit_init
  - empty_count
  - closure_spacing
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

analyzer_rules:
  - unused_import

disabled_rules:
  - todo

trailing_comma:
  mandatory_comma: true

line_length:
  warning: 100
  error: 130

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 2
  excluded:
    - id
